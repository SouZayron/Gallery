<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yumi Aozora · Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETA 60-30-10  (5 cores no total)
   60% → --c-base   : fundo azul-noite
   30% → --c-mid    : azul dos cards/painéis
   10% → --c-accent : ciano de destaque
   + --c-text (texto claro) e --c-muted (texto secundário)
   ============================================================ */
:root{
  --c-base:#0b1a2e;
  --c-mid:#1d4e7a;
  --c-accent:#5ce1e6;
  --c-text:#eaf6ff;
  --c-muted:#8fb3d1;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}          /* SEM ROLAGEM */
body{
  font-family:'Poppins',sans-serif;
  background:var(--c-base);
  color:var(--c-text);
  height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  gap:clamp(8px,1.6vh,18px);
  padding:clamp(10px,2vh,22px) clamp(12px,3vw,40px);
  position:relative;
}

/* ---------------- FUNDO ANIMADO ---------------- */
#stars{position:fixed;inset:0;z-index:-2}
.blob{
  position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-3;
  animation:float 18s ease-in-out infinite alternate;
}
.blob.b1{width:45vw;height:45vw;background:var(--c-mid);top:-15vw;left:-10vw}
.blob.b2{width:35vw;height:35vw;background:var(--c-accent);bottom:-15vw;right:-8vw;opacity:.18;animation-delay:-6s}
.blob.b3{width:25vw;height:25vw;background:var(--c-mid);top:40%;left:55%;animation-delay:-12s}
@keyframes float{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(4vw,-3vh) scale(1.1)}
  100%{transform:translate(-3vw,4vh) scale(.95)}
}

/* ---------------- HEADER ---------------- */
header{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px}
.logo span{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  background:var(--c-mid);color:var(--c-accent);font-size:1.1rem;
}
/* ---------------- RODAPÉ ---------------- */
footer{text-align:center;font-size:.75rem;color:var(--c-muted);letter-spacing:1px;margin-top:-4px}
footer a{color:var(--c-accent);text-decoration:none;font-weight:600;transition:.3s}
footer a:hover{text-shadow:0 0 10px var(--c-accent)}
.status{
  display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--c-muted);
  border:1px solid var(--c-mid);padding:6px 14px;border-radius:30px;
}
.status i{width:8px;height:8px;border-radius:50%;background:var(--c-accent);box-shadow:0 0 10px var(--c-accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------------- MAIN ---------------- */
main{
  display:grid;
  grid-template-columns:1.55fr 1fr;
  gap:clamp(10px,2vw,24px);
  min-height:0;
}
.card{
  background:linear-gradient(145deg,rgba(29,78,122,.55),rgba(29,78,122,.2));
  border:1px solid rgba(92,225,230,.15);
  border-radius:var(--radius);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  min-height:0;
}

/* ---------------- PERFIL ---------------- */
.profile{
  display:grid;grid-template-columns:auto 1fr;align-items:center;
  gap:clamp(16px,3vw,44px);padding:clamp(16px,3vw,44px);position:relative;overflow:hidden;
}
.profile::before{ /* brilho diagonal que passa pelo card */
  content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(234,246,255,.07),transparent);
  transform:rotate(20deg);animation:shine 7s infinite;
}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}

.avatar-wrap{position:relative;width:clamp(120px,22vh,250px);aspect-ratio:1}
.avatar-wrap::before{ /* anel giratório */
  content:"";position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(var(--c-accent),transparent 30%,var(--c-mid) 60%,var(--c-accent));
  animation:spin 6s linear infinite;
}
.avatar-wrap::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--c-base)}
.avatar-wrap img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--c-mid)}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-wrap .lvl{
  position:absolute;z-index:2;bottom:4%;right:4%;background:var(--c-accent);color:var(--c-base);
  font-weight:800;font-size:.75rem;padding:4px 10px;border-radius:20px;
}

.info{min-width:0;position:relative;z-index:1}
.tag{font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:var(--c-accent);font-weight:600}

/* EFEITO NO NOME: gradiente animado + glow + letras em onda */
.name{
  font-size:clamp(2rem,6.5vh,4.6rem);font-weight:800;line-height:1.05;margin:4px 0 10px;
  filter:drop-shadow(0 0 18px rgba(92,225,230,.35));
}
.name span{
  display:inline-block;
  background:linear-gradient(90deg,var(--c-text),var(--c-accent),var(--c-text),var(--c-accent));
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:wave 2.8s ease-in-out infinite, grad 5s linear infinite;
}
.name span.sp{width:.3em}
@keyframes wave{0%,100%{transform:translateY(0)}25%{transform:translateY(-8px)}50%{transform:translateY(0)}}
@keyframes grad{to{background-position:300% 0}}

.id{
  display:inline-flex;align-items:center;gap:10px;background:rgba(11,26,46,.6);
  border:1px solid var(--c-mid);padding:6px 8px 6px 14px;border-radius:30px;font-size:.85rem;color:var(--c-muted);
}
.id b{color:var(--c-text);letter-spacing:1px}
.id button{
  border:none;background:var(--c-mid);color:var(--c-accent);cursor:pointer;
  padding:4px 12px;border-radius:20px;font:600 .75rem 'Poppins';transition:.3s;
}
.id button:hover{background:var(--c-accent);color:var(--c-base)}
.bio{margin:clamp(10px,2vh,18px) 0;color:var(--c-muted);font-size:clamp(.8rem,1.8vh,1rem);line-height:1.6;max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:.75rem;padding:5px 12px;border-radius:20px;background:rgba(29,78,122,.8);border:1px solid rgba(92,225,230,.25)}

/* ---------------- AMIGOS ---------------- */
.friends{padding:clamp(14px,2.4vw,28px);display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px)}
.friends h2{font-size:clamp(1rem,2.4vh,1.4rem);display:flex;justify-content:space-between;align-items:center}
.friends h2 small{font-size:.75rem;color:var(--c-accent);font-weight:400}
.f-list{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(4px,1vh,10px);min-height:0}
.friend{
  flex:1;display:flex;align-items:center;gap:14px;padding:0 14px;border-radius:14px;
  background:rgba(11,26,46,.45);border:1px solid transparent;transition:.3s;cursor:pointer;min-height:0;
  opacity:0;animation:in .6s forwards;
}
.friend:hover{border-color:var(--c-accent);transform:translateX(6px);background:rgba(29,78,122,.6)}
.friend img{height:clamp(32px,6.5vh,54px);aspect-ratio:1;border-radius:50%;background:var(--c-mid);border:2px solid var(--c-mid)}
.friend:hover img{border-color:var(--c-accent)}
.friend div{min-width:0}
.friend b{display:block;font-size:clamp(.8rem,1.8vh,.95rem)}
.friend small{color:var(--c-muted);font-size:.72rem}
.friend .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--c-muted)}
.friend .dot.on{background:var(--c-accent);box-shadow:0 0 8px var(--c-accent)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------------- PLAYER ---------------- */
.player{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(10px,2vw,24px);
  padding:clamp(10px,1.6vh,14px) clamp(14px,2vw,24px);
}
.ctrl{display:flex;align-items:center;gap:10px}
.btn-play{
  width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;
  background:var(--c-accent);color:var(--c-base);display:grid;place-items:center;
  box-shadow:0 0 0 0 rgba(92,225,230,.6);transition:.3s;
}
.btn-play.playing{animation:ring 1.8s infinite}
.btn-play:hover{transform:scale(1.08)}
.btn-play svg{width:20px;height:20px;fill:currentColor}
@keyframes ring{70%{box-shadow:0 0 0 14px rgba(92,225,230,0)}100%{box-shadow:0 0 0 0 rgba(92,225,230,0)}}

.screen{
  min-width:0;background:rgba(11,26,46,.75);border:1px solid var(--c-mid);border-radius:12px;
  padding:8px 14px;display:flex;align-items:center;gap:14px;overflow:hidden;
}
.eq{display:flex;align-items:flex-end;gap:3px;height:22px;flex-shrink:0}
.eq i{width:4px;height:4px;background:var(--c-accent);border-radius:2px;transition:height .3s}
.player.on .eq i{animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s!important}.eq i:nth-child(3){animation-delay:-.5s!important}
.eq i:nth-child(4){animation-delay:-.7s!important}.eq i:nth-child(5){animation-delay:-.35s!important}
@keyframes eq{from{height:4px}to{height:22px}}
.marquee{flex:1;overflow:hidden;white-space:nowrap;min-width:0}
.marquee small{display:block;font-size:.65rem;color:var(--c-muted);letter-spacing:2px}
.marquee p{display:inline-block;font-weight:600;font-size:.9rem;padding-left:100%;animation:scroll 14s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}

.vol{display:flex;align-items:center;gap:10px;color:var(--c-muted)}
.vol button{background:none;border:none;color:inherit;cursor:pointer;display:grid}
.vol svg{width:20px;height:20px;fill:currentColor}
.vol input{
  -webkit-appearance:none;appearance:none;width:clamp(70px,10vw,130px);height:5px;border-radius:5px;cursor:pointer;
  background:linear-gradient(90deg,var(--c-accent) var(--v,50%),var(--c-mid) var(--v,50%));
}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--c-text)}
.vol input::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--c-text)}

/* YouTube escondido: só o som */
#yt{position:fixed;width:200px;height:200px;left:-9999px;top:-9999px;opacity:0;pointer-events:none}

/* ---------------- OVERLAY "CLIQUE PARA ENTRAR" ---------------- */
#enter{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;cursor:pointer;
  background:rgba(11,26,46,.92);backdrop-filter:blur(6px);transition:opacity .8s;
}
#enter p{font-size:clamp(1rem,2.5vw,1.4rem);letter-spacing:6px;text-transform:uppercase;animation:pulse 1.8s infinite}
#enter p b{color:var(--c-accent)}
#enter.hide{opacity:0;pointer-events:none}

/* toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translate(-50%,-80px);z-index:60;
  background:var(--c-accent);color:var(--c-base);font-weight:600;font-size:.85rem;
  padding:8px 18px;border-radius:20px;transition:.4s;
}
.toast.show{transform:translate(-50%,0)}

/* ---------------- RESPONSIVO (continua sem rolagem) ---------------- */
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .profile{grid-template-columns:1fr;justify-items:center;text-align:center;align-content:center;gap:14px}
  .bio{margin-inline:auto}
  .chips{justify-content:center}
  .avatar-wrap{width:clamp(90px,18vh,160px)}
  .friends h2 small{display:none}
  .f-list{flex-direction:row}
  .friend{flex-direction:column;justify-content:center;gap:4px;padding:8px 4px;text-align:center}
  .friend:hover{transform:translateY(-4px)}
  .friend small,.friend .dot{display:none}
  .friend b{font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px}
  .vol input{display:none}
}
@media (max-height:560px){ .bio{display:none} }
</style>
</head>
<body>

<!-- Fundo -->
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="stars"></canvas>

<!-- Overlay para liberar o áudio (navegadores bloqueiam autoplay com som) -->
<div id="enter"><p>Clique para <b>entrar</b></p></div>
<div class="toast" id="toast">ID copiado!</div>

<header>
  <div class="logo"><span>Y</span>AOZORA</div>
  <div class="status"><i></i>Online agora</div>
</header>

<main>
  <!-- PERFIL -->
  <section class="card profile">
    <div class="avatar-wrap">
      <img id="avatar" alt="Foto de perfil">
      <div class="lvl">LV 27</div>
    </div>
    <div class="info">
      <div class="tag">Ilustradora digital · Tóquio Neo</div>
      <h1 class="name" id="name"></h1>
      <div class="id">ID <b id="uid"></b><button id="copy">Copiar</button></div>
      <p class="bio" id="bio"></p>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <!-- AMIGOS -->
  <section class="card friends">
    <h2>Amigos <small id="fcount"></small></h2>
    <div class="f-list" id="friends"></div>
  </section>
</main>

<!-- PLAYER -->
<section class="card player" id="player">
  <div class="ctrl">
    <button class="btn-play" id="play" aria-label="Play/Pause">
      <svg id="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
  <div class="screen">
    <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="marquee">
      <small>TOCANDO AGORA</small>
      <p id="song">Carregando...</p>
    </div>
  </div>
  <div class="vol">
    <button id="mute" aria-label="Mudo">
      <svg id="vico" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    </button>
    <input type="range" id="volume" min="0" max="100" value="50">
  </div>
</section>

<footer>Feito por <a href="https://xat.com/rav" target="_blank" rel="noopener">Zark</a></footer>

<div id="yt"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO — edite só aqui
   ============================================================ */
const CONFIG = {
  name: "Yumi Aozora",
  id: "AZR-0917",
  bio: "Ilustradora e designer de personagens. Passo as noites desenhando cidades que não existem e ouvindo lo-fi até o sol nascer. Criadora da série 'Céu de Vidro' e fã incurável de chá gelado de pêssego.",
  chips: ["Ilustração", "Character Design", "Lo-fi", "Pixel Art"],
  // Foto principal (troque por ./img/foto.jpg depois)
  photo: "https://api.dicebear.com/9.x/lorelei/svg?seed=YumiAozora&backgroundColor=1d4e7a",
  // Até 5 amigos
  friends: [
    { name: "Ren Takeda",    role: "Animador 2D",   online: true,  photo: "https://api.dicebear.com/9.x/lorelei/svg?seed=RenTakeda&backgroundColor=1d4e7a" },
    { name: "Mio Hoshino",   role: "Compositora",   online: true,  photo: "https://api.dicebear.com/9.x/lorelei/svg?seed=MioHoshino&backgroundColor=1d4e7a" },
    { name: "Sora Kitagawa", role: "Roteirista",    online: false, photo: "https://api.dicebear.com/9.x/lorelei/svg?seed=SoraKitagawa&backgroundColor=1d4e7a" },
    { name: "Hana Mizuki",   role: "Cosplayer",     online: true,  photo: "https://api.dicebear.com/9.x/lorelei/svg?seed=HanaMizuki&backgroundColor=1d4e7a" },
    { name: "Kai Fujimoto",  role: "Dev de jogos",  online: false, photo: "https://api.dicebear.com/9.x/lorelei/svg?seed=KaiFujimoto&backgroundColor=1d4e7a" }
  ],
  // Música: ID do vídeo do YouTube (a parte depois de "v=")
  youtubeId: "jfKfPfyJRdk",
  // Nome exibido na tela (deixe "" para usar o título do YouTube)
  songTitle: "",
  volume: 50
};

/* ---------------- Monta o perfil ---------------- */
const $ = id => document.getElementById(id);
$("avatar").src = CONFIG.photo;
$("name").innerHTML = [...CONFIG.name].map((c,i) =>
  c === " " ? '<span class="sp"> </span>' : `<span style="animation-delay:${i*0.08}s,0s">${c}</span>`
).join("");
$("uid").textContent = "#" + CONFIG.id;
$("bio").textContent = CONFIG.bio;
$("chips").innerHTML = CONFIG.chips.map(c => `<span>${c}</span>`).join("");

const fr = CONFIG.friends.slice(0,5);
$("fcount").textContent = fr.filter(f=>f.online).length + " online";
$("friends").innerHTML = fr.map((f,i) => `
  <div class="friend" style="animation-delay:${0.2+i*0.12}s">
    <img src="${f.photo}" alt="${f.name}">
    <div><b>${f.name}</b><small>${f.role}</small></div>
    <span class="dot ${f.online?'on':''}"></span>
  </div>`).join("");

$("copy").onclick = () => {
  navigator.clipboard?.writeText("#"+CONFIG.id);
  const t = $("toast"); t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1600);
};

/* ---------------- Fundo: estrelas + partículas ---------------- */
const cv = $("stars"), ctx = cv.getContext("2d");
let W, H, stars = [];
function resize(){
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  stars = Array.from({length: Math.min(160, W/8)}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.6+.3, s: Math.random()*.3+.05, a: Math.random()*Math.PI*2
  }));
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const p of stars){
    p.y -= p.s; p.a += .02;
    if(p.y < -5){ p.y = H+5; p.x = Math.random()*W; }
    ctx.globalAlpha = .4 + Math.sin(p.a)*.4;
    ctx.fillStyle = p.r > 1.4 ? "#5ce1e6" : "#eaf6ff";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  requestAnimationFrame(draw);
}
addEventListener("resize", resize); resize(); draw();

/* ---------------- Player do YouTube (só áudio) ---------------- */
let yt, ready = false, playing = false, wantPlay = false;
const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const VOL_ON  = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>';
const VOL_OFF = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/>';

$("song").textContent = CONFIG.songTitle || "Clique em play ▶";

const PREVIEW = /[?&]preview/.test(location.search);
if (PREVIEW) $("enter").remove();
else { const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag); }

window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("yt", {
    videoId: CONFIG.youtubeId,
    playerVars: { autoplay:0, controls:0, loop:1, playlist:CONFIG.youtubeId, playsinline:1 },
    events: {
      onReady: () => {
        ready = true;
        yt.setVolume(CONFIG.volume);
        if (wantPlay) yt.playVideo();
      },
      onStateChange: e => {
        playing = e.data === YT.PlayerState.PLAYING;
        $("ico").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
        $("play").classList.toggle("playing", playing);
        $("player").classList.toggle("on", playing);
        if (playing && !CONFIG.songTitle){
          const t = yt.getVideoData().title;
          if (t) $("song").textContent = t;
        }
      }
    }
  });
};

function play(){ wantPlay = true; if (ready) yt.playVideo(); }
$("play").onclick = () => { if (!ready) return play(); playing ? yt.pauseVideo() : yt.playVideo(); };

const vol = $("volume");
vol.value = CONFIG.volume; vol.style.setProperty("--v", CONFIG.volume+"%");
vol.oninput = () => {
  vol.style.setProperty("--v", vol.value+"%");
  if (ready){ yt.setVolume(+vol.value); yt.unMute(); }
  $("vico").innerHTML = +vol.value === 0 ? VOL_OFF : VOL_ON;
};
let lastVol = CONFIG.volume;
$("mute").onclick = () => {
  if (+vol.value > 0){ lastVol = vol.value; vol.value = 0; } else { vol.value = lastVol || 50; }
  vol.oninput();
};

/* Toca ao clicar na página (overlay de entrada) */
if (!PREVIEW) $("enter").onclick = () => { $("enter").classList.add("hide"); play(); };
</script>
</body>
</html>
